[theme]
base = "light"
primaryColor = "#2f5d50"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f0eee8"
textColor = "#1c2321"
font = "sans serif"

[server]
maxUploadSize = 200

[client]
# Visitors see a short message instead of a Python traceback if something fails.
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
